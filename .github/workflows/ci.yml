name: ERP CI
on:
  push:
    branches: [main, develop/**]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Python and JS syntax
        run: |
          python -m py_compile api/*.py
          node --check public/app.js
      - name: SQLite functional and authorization tests
        run: PYTHONPATH=. python -m pytest -q tests/test_flows.py tests/test_security_headers.py tests/test_csrf_origin.py
      - name: PostgreSQL schema bootstrap
        env:
          DATABASE_URL: postgresql+psycopg2://erp:ci-only-secret@localhost:5432/erp
          APP_SECRET: ci-only-insecure-test-signing-secret
        run: |
          python -m api.init_db
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0002_invoices.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0003_seed_public_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0003_seed_public_demo.sql
          python -c "from api.db import engine; from sqlalchemy import inspect; n=len(inspect(engine).get_table_names()); print(f'PostgreSQL tables: {n}'); assert n >= 41"
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0004_tenant_rls.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0005_finance_ledger.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0006_seed_ledger_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0006_seed_ledger_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0007_integrations.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0008_seed_integrations_ledger.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0009_traceability.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0010_seed_traceability_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0011_revocable_sessions.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0012_partial_fulfillment.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0013_seed_fulfillments_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0013_seed_fulfillments_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0014_tenant_integrity.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO tenants (id,name,currency,created_at) VALUES
            ('ci-other-tenant','Other Tenant','TOMAN',NOW());
          INSERT INTO categories (id,tenant_id,name,created_at) VALUES
            ('ci-other-cat','ci-other-tenant','Other Category',NOW());
          DO $block$
          BEGIN
            BEGIN
              INSERT INTO products (id,tenant_id,name,category_id,active,archived,created_at)
              VALUES('ci-forged-product','demo-erp-tenant-2026','Cross tenant',
                     'ci-other-cat',true,false,NOW());
              RAISE EXCEPTION 'Cross-tenant FK accepted invalid relationship';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;
          END $block$;
          ROLLBACK;
          SQL
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0010_seed_traceability_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE erp_rls_test;
          GRANT USAGE ON SCHEMA public TO erp_rls_test;
          GRANT SELECT ON public.products TO erp_rls_test;
          BEGIN;
          SET ROLE erp_rls_test;
          DO $block$
          BEGIN
            IF (SELECT COUNT(*) FROM products) <> 0 THEN
              RAISE EXCEPTION 'RLS should block missing tenant scope';
            END IF;
          END $block$;
          SELECT set_config('erp.tenant_id','demo-erp-tenant-2026',true);
          DO $block$
          BEGIN
            IF (SELECT COUNT(*) FROM products) <> 96 THEN
              RAISE EXCEPTION 'RLS should show 96 demo products';
            END IF;
          END $block$;
          ROLLBACK;
          SQL
          # Public showroom has many synthetic records across all commercial modules.
          # Apply twice to prove that the seed can safely be rerun.
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0015_enrich_public_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0015_enrich_public_demo.sql
          test "$(psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -tAc "SELECT count(*) FROM products WHERE tenant_id='demo-erp-tenant-2026'")" -eq 416
          test "$(psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -tAc "SELECT count(*) FROM variants WHERE tenant_id='demo-erp-tenant-2026'")" -eq 832
          test "$(psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -tAc "SELECT count(*) FROM stocks WHERE tenant_id='demo-erp-tenant-2026'")" -eq 4992
          test "$(psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -tAc "SELECT count(*) FROM sales_orders WHERE tenant_id='demo-erp-tenant-2026'")" -eq 460
          test "$(psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -tAc "SELECT count(*) FROM purchase_orders WHERE tenant_id='demo-erp-tenant-2026'")" -eq 270

      - name: PostgreSQL API acceptance (actual database, not SQLite)
        env:
          DATABASE_URL: postgresql+psycopg2://erp:ci-only-secret@localhost:5432/erp
          APP_SECRET: ci-only-insecure-test-signing-secret
          PUBLIC_DEMO_ENABLED: 'true'
        run: PYTHONPATH=. python -m pytest -q tests/test_postgres_live_api.py tests/test_postgres_existing_record_write_guard.py tests/test_postgres_existing_resource_matrix.py

      - name: PostgreSQL multi-tenant RLS matrix (all tenant-scoped tables)
        run: psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f tests/postgres_rls_matrix.sql

      - name: PostgreSQL backup/restore disaster recovery drill
        env:
          DATABASE_URL: postgresql+psycopg2://erp:ci-only-secret@localhost:5432/erp
          RESTORE_DATABASE_URL: postgresql://erp:ci-only-secret@localhost:5432/erp_restore
        run: |
          bash scripts/backup.sh /tmp/store-erp-ci.dump
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erp_restore OWNER erp'
          bash scripts/restore.sh /tmp/store-erp-ci.dump
          test "$(psql "$RESTORE_DATABASE_URL" -tAc "SELECT count(*) FROM products WHERE tenant_id='demo-erp-tenant-2026'")" -eq 416
          test "$(psql "$RESTORE_DATABASE_URL" -tAc "SELECT count(*) FROM fulfillments WHERE tenant_id='demo-erp-tenant-2026'")" -ge 70
          test "$(psql "$RESTORE_DATABASE_URL" -tAc "SELECT count(*) FROM pg_constraint WHERE conname LIKE 'fk_%_tenant'")" -eq 42
          echo 'PostgreSQL backup and safe restore: PASS'


