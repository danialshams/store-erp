name: ERP CI
on:
  push:
    branches: [main, develop/**]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Python and JS syntax
        run: |
          python -m py_compile api/*.py
          node --check public/app.js
      - name: SQLite functional and authorization tests
        run: PYTHONPATH=. python -m pytest -q tests/test_flows.py
      - name: PostgreSQL schema bootstrap
        env:
          DATABASE_URL: postgresql+psycopg2://erp:ci-only-secret@localhost:5432/erp
          APP_SECRET: ci-only-insecure-test-signing-secret
        run: |
          python -m api.init_db
          python -c "from api.db import engine; from sqlalchemy import inspect; n=len(inspect(engine).get_table_names()); print(f'PostgreSQL tables: {n}'); assert n >= 30"
