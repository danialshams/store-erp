name: ERP CI
on:
  push:
    branches: [main, develop/**]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Python and JS syntax
        run: |
          python -m py_compile api/*.py
          node --check public/app.js
      - name: SQLite functional and authorization tests
        run: PYTHONPATH=. python -m pytest -q tests/test_flows.py
      - name: PostgreSQL schema bootstrap
        env:
          DATABASE_URL: postgresql+psycopg2://erp:ci-only-secret@localhost:5432/erp
          APP_SECRET: ci-only-insecure-test-signing-secret
        run: |
          python -m api.init_db
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0002_invoices.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0003_seed_public_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0003_seed_public_demo.sql
          python -c "from api.db import engine; from sqlalchemy import inspect; n=len(inspect(engine).get_table_names()); print(f'PostgreSQL tables: {n}'); assert n >= 40"
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0004_tenant_rls.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0005_finance_ledger.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0006_seed_ledger_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0006_seed_ledger_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0007_integrations.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0008_seed_integrations_ledger.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0009_traceability.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0010_seed_traceability_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0011_revocable_sessions.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 -f migrations/0010_seed_traceability_demo.sql
          psql 'postgresql://erp:ci-only-secret@localhost:5432/erp' -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE erp_rls_test;
          GRANT USAGE ON SCHEMA public TO erp_rls_test;
          GRANT SELECT ON public.products TO erp_rls_test;
          BEGIN;
          SET ROLE erp_rls_test;
          DO $block$
          BEGIN
            IF (SELECT COUNT(*) FROM products) <> 0 THEN
              RAISE EXCEPTION 'RLS should block missing tenant scope';
            END IF;
          END $block$;
          SELECT set_config('erp.tenant_id','demo-erp-tenant-2026',true);
          DO $block$
          BEGIN
            IF (SELECT COUNT(*) FROM products) <> 96 THEN
              RAISE EXCEPTION 'RLS should show 96 demo products';
            END IF;
          END $block$;
          ROLLBACK;
          SQL

